name: taplink-homolog

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${APP_PORT:-3400}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - taplink_uploads:/app/data/uploads
    networks:
      - taplink_internal
      - taplink_edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    cpus: 1.0

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taplink_internal
    mem_limit: 512m
    cpus: 0.5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - taplink_postgres_data:/var/lib/postgresql/data
    networks:
      - taplink_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    cpus: 1.0

networks:
  taplink_internal:
    name: taplink_homolog_internal
    internal: true
  taplink_edge:
    name: taplink_homolog_edge

volumes:
  taplink_postgres_data:
    name: taplink_homolog_postgres_data
  taplink_uploads:
    name: taplink_homolog_uploads
